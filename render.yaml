services:
  - type: web
    name: mobilya-os-backend
    region: virginia
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: mobile-pilot-v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_DISABLED
        value: "false"
      - key: DEMO_TODAY
        value: "2026-05-14"
      - key: RUN_SEED_ON_BOOT
        value: "false"
      - key: SEED_USERS_JSON
        sync: false
      - key: AI_WORKER_ENABLED
        value: "false"
      - key: AI_LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WOO_STORE_URL
        sync: false
      - key: WOO_CONSUMER_KEY
        sync: false
      - key: WOO_CONSUMER_SECRET
        sync: false
