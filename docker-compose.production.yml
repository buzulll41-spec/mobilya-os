name: mobilya-os-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - mobilya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - mobilya_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: mobilya-os-prod-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['/usr/local/bin/backend-migrate.sh']

  seed:
    image: mobilya-os-prod-backend
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT}
    command: ['/usr/local/bin/backend-seed.sh']

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      AUTH_DISABLED: ${AUTH_DISABLED}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
      STORAGE_PATH: /data/storage
      BACKUP_PATH: /data/backups
    volumes:
      - ./storage:/data/storage
      - mobilya_backups:/data/backups
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4000/health\").then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_MODE: auto
        VITE_ALLOW_RUNTIME_MODE: 'false'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4173\").then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '${NGINX_PORT}:80'
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: ./ops/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mobilya_backups:/backups
      - ./storage:/storage:ro
      - ./env:/config:ro
    healthcheck:
      test: ['CMD-SHELL', 'test -e /backups/latest']
      interval: 20s
      timeout: 5s
      retries: 6

  monitor:
    build:
      context: ./ops/monitor
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      METRICS_URL: http://backend:4000/v1/ops/metrics
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS}
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/monitor_heartbeat']
      interval: 20s
      timeout: 5s
      retries: 6

  worker:
    image: node:20-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        while true; do
          node -e "fetch('http://backend:4000/v1/ops/metrics').then((r)=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" && date > /tmp/worker_heartbeat;
          sleep 15;
        done
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/worker_heartbeat']
      interval: 20s
      timeout: 5s
      retries: 6

  health:
    image: node:20-alpine
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
      worker:
        condition: service_healthy
      monitor:
        condition: service_healthy
      backup:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        while true; do
          node -e "Promise.all([fetch('http://backend:4000/system/status'), fetch('http://backend:4000/v1/health'), fetch('http://nginx/nginx-health')]).then((res)=>res.every((r)=>r.ok)?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" && date > /tmp/health_heartbeat;
          sleep 15;
        done
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/health_heartbeat']
      interval: 20s
      timeout: 5s
      retries: 6

  smoke:
    image: node:20-alpine
    restart: 'no'
    depends_on:
      health:
        condition: service_healthy
    working_dir: /workspace
    environment:
      SMOKE_BASE_URL: http://nginx
      SMOKE_USER_EMAIL: admin@mobilya.local
      SMOKE_USER_PASSWORD: admin123
    volumes:
      - ./:/workspace
    command: ['node', 'scripts/production-smoke.mjs']

volumes:
  mobilya_pg_data:
  mobilya_redis_data:
  mobilya_backups:
